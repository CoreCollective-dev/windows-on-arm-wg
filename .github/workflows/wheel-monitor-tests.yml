name: Wheel monitor tests

on:
  pull_request:
    paths:
      - 'monitoring/**'
      - '.github/workflows/wheel-monitor*.yml'
  push:
    branches: [main]
    paths:
      - 'monitoring/**'
      - '.github/workflows/wheel-monitor*.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s monitoring/tests -v
