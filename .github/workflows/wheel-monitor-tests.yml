name: Wheel monitor tests

on:
  pull_request:
    paths:
      - 'monitoring/**'
      - '.github/workflows/wheel-monitor*.yml'
  push:
    branches: [main]
    paths:
      - 'monitoring/**'
      - '.github/workflows/wheel-monitor*.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s monitoring/tests -v
