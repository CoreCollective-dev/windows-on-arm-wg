name: Windows Arm64 wheel monitor (daily pilot)

on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wheel-monitor-pilot
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test monitor
        run: python -m unittest discover -s monitoring/tests -v
      - name: Observe upstream builds (no issue or board writes)
        env:
          GH_TOKEN: ${{ github.token }}
          MONITOR_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          args=()
          if [ "$MONITOR_EVENT" = "schedule" ]; then
            args+=(--scheduled)
          fi
          python -m monitoring.monitor --restore "${args[@]}"
      - name: Preserve report and next poll state
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-monitor-report
          path: monitor-output/
          retention-days: 90
          if-no-files-found: error
