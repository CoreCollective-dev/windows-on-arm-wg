name: Windows Arm64 wheel monitor (daily fleet)

on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: wheel-monitor-pilot
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test monitor
        run: python -m unittest discover -s monitoring/tests -v
      - name: Observe all 84 dispositions (upstream reads only)
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          MONITOR_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          args=()
          if [ "$MONITOR_EVENT" = "schedule" ]; then
            args+=(--scheduled)
          fi
          python -m monitoring.monitor --restore "${args[@]}"
      - name: Update enrolled tracker issues and deliver new transitions
        if: ${{ !cancelled() && steps.collect.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m monitoring.issues --apply --report monitor-output/report.json --state monitor-output/state.json --mapping monitoring/tracking.json
      - name: Preserve report and next poll state
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-monitor-report
          path: monitor-output/
          retention-days: 90
          if-no-files-found: error
